# arbstr node — full-stack inference marketplace
#
# Services:
#   core   — arbstr routing engine (Rust)
#   vault  — arbstr treasury service (TypeScript)
#   lnd    — Lightning Network daemon
#   mint   — Nutshell Cashu mint (self-hosted)
#
# Usage:
#   cp .env.example .env           # fill in secrets
#   docker compose up -d           # start all services
#   docker compose logs -f core    # follow core logs
#   docker compose down            # stop all services
#
# Versions: core and vault are pinned to releases below; each arbstr-node
# release lists them. To upgrade, change the tag and run:
#   docker compose pull && docker compose up -d
#   docker compose up -d --force-recreate core           # after editing config.toml

services:
  # Lightning Network daemon (regtest for development)
  lnd:
    image: lightninglabs/lnd:v0.21.4-beta
    command:
      - --bitcoin.active
      - --bitcoin.regtest
      - --bitcoin.node=neutrino
      - --noseedbackup
      - --restlisten=0.0.0.0:8080
      - --rpclisten=0.0.0.0:10009
    # Host ports are bound to 127.0.0.1: reachable from this machine only.
    # Vault reaches lnd over the compose network and needs neither.
    ports:
      - "127.0.0.1:10009:10009"  # gRPC
      - "127.0.0.1:8180:8080"    # REST
    volumes:
      - lnd-data:/root/.lnd
    healthcheck:
      test: ["CMD", "lncli", "--network=regtest", "getinfo"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Cashu mint (self-hosted Nutshell)
  mint:
    image: cashubtc/nutshell:0.21.0
    command: ["poetry", "run", "mint"]
    environment:
      - MINT_BACKEND_BOLT11_SAT=FakeWallet
      - MINT_LISTEN_HOST=0.0.0.0
      - MINT_LISTEN_PORT=3338
      # Signs the mint's ecash: required, no default (a known key lets anyone mint)
      - MINT_PRIVATE_KEY=${MINT_PRIVATE_KEY:?Set MINT_PRIVATE_KEY in .env (openssl rand -hex 32)}
    ports:
      - "127.0.0.1:3338:3338"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3338/v1/info"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # arbstr vault — treasury service (agent accounts, payments, policy)
  vault:
    # https://github.com/johnzilla/arbstr-vault/releases
    image: ghcr.io/johnzilla/arbstr-vault:1.3.2
    environment:
      - PORT=3000
      - DATABASE_PATH=/data/vault.db
      - WALLET_BACKEND=${WALLET_BACKEND:-simulated}
      - LND_HOST=lnd
      - LND_PORT=10009
      - LND_CERT_BASE64=${LND_CERT_BASE64:-}
      - LND_MACAROON_BASE64=${LND_MACAROON_BASE64:-}
      - CASHU_MINT_URL=http://mint:3338
      - CASHU_THRESHOLD_MSAT=${CASHU_THRESHOLD_MSAT:-1000000}
      - VAULT_ADMIN_TOKEN=${VAULT_ADMIN_TOKEN}
      - VAULT_INTERNAL_TOKEN=${VAULT_INTERNAL_TOKEN}
      # Optional — bare names pass the value from .env only when it is set.
      # (Vault rejects empty strings for these, so ${VAR:-} would break startup.)
      - OPERATOR_WEBHOOK_URL
      - OPERATOR_WEBHOOK_SECRET
      - BILLING_RESERVATION_TTL_MS
    # Admin API (agents, deposits, approvals, audit): this machine only.
    # For remote admin, use an SSH tunnel rather than widening this binding.
    ports:
      - "127.0.0.1:3010:3000"
    volumes:
      - vault-data:/data
    depends_on:
      lnd:
        condition: service_healthy
      mint:
        condition: service_healthy
    healthcheck:
      # node:22-slim has no curl — probe with Node's built-in fetch
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # arbstr core — routing engine
  core:
    # https://github.com/johnzilla/arbstr/releases
    image: ghcr.io/johnzilla/arbstr:2.3.1
    environment:
      - RUST_LOG=${RUST_LOG:-arbstr=info}
      - VAULT_INTERNAL_TOKEN=${VAULT_INTERNAL_TOKEN}
      # Optional keys for static providers / [tokenstats.keys] (${VAR} expansion)
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - ROUTSTR_API_KEY=${ROUTSTR_API_KEY:-}
      - ARBSTR_ANTHROPIC_API_KEY=${ARBSTR_ANTHROPIC_API_KEY:-}
      # Empty when unset: core treats an empty operator_token as unset (analytics refused)
      - ARBSTR_OPERATOR_TOKEN=${ARBSTR_OPERATOR_TOKEN:-}

    ports:
      - "8080:8080"
    volumes:
      - ./config.toml:/config/config.toml:ro
      - core-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  lnd-data:
  vault-data:
  core-data:
